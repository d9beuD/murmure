name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version sémantique sans le préfixe v (ex. 0.1.0)
        required: true
        type: string
      prerelease:
        description: Publier comme préversion
        required: true
        default: false
        type: boolean
      draft:
        description: Créer la release en brouillon
        required: true
        default: true
        type: boolean
      notarize:
        description: Signer avec Developer ID et notariser (secrets requis)
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build DMG and create GitHub release
    runs-on: macos-26
    env:
      MURMURE_VERSION: ${{ inputs.version }}
      MURMURE_BUILD_NUMBER: ${{ github.run_number }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build and test
        run: |
          swift build -Xswiftc -warnings-as-errors
          swift test -Xswiftc -warnings-as-errors

      - name: Audit repository contents
        run: |
          ! git ls-files | grep -E '\.(wav|aiff|aif|caf|m4a|mp3|p12|mobileprovision)$'
          ! git grep -nE 'sk-[A-Za-z0-9]{20,}'

      - name: Install Developer ID certificate
        if: inputs.notarize
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.BUILD_KEYCHAIN_PASSWORD }}
        run: |
          test -n "$CERTIFICATE_BASE64"
          test -n "$CERTIFICATE_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/murmure-signing.keychain-db"
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychain -d user -s "$keychain_path" login.keychain-db
          identity=$(security find-identity -v -p codesigning "$keychain_path" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)
          test -n "$identity"
          echo "MURMURE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build DMG
        run: |
          export MURMURE_SIGNING_IDENTITY="${MURMURE_SIGNING_IDENTITY:--}"
          ./Scripts/build-dmg.sh

      - name: Notarize DMG
        if: inputs.notarize
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_ISSUER_ID: ${{ secrets.APPLE_ISSUER_ID }}
        run: |
          test -n "$APPLE_API_KEY_BASE64"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_ISSUER_ID"
          api_key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$api_key_path"
          dmg_path=".build/release-artifacts/Murmure-$MURMURE_VERSION-macos.dmg"
          xcrun notarytool submit "$dmg_path" --key "$api_key_path" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_ISSUER_ID" --wait
          xcrun stapler staple "$dmg_path"
          shasum -a 256 "$dmg_path" > "$dmg_path.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Murmure-${{ inputs.version }}-macos
          path: |
            .build/release-artifacts/*.dmg
            .build/release-artifacts/*.sha256
          if-no-files-found: error

      - name: Create GitHub release
        run: |
          tag="v$MURMURE_VERSION"
          release_args=("$tag" ".build/release-artifacts/Murmure-$MURMURE_VERSION-macos.dmg" ".build/release-artifacts/Murmure-$MURMURE_VERSION-macos.dmg.sha256" "--title" "Murmure $MURMURE_VERSION" "--generate-notes")
          [[ "${{ inputs.draft }}" == "true" ]] && release_args+=("--draft")
          [[ "${{ inputs.prerelease }}" == "true" ]] && release_args+=("--prerelease")
          gh release create "${release_args[@]}"
