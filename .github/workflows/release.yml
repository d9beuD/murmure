name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without the v prefix (for example, 0.1.0)
        required: true
        type: string
      prerelease:
        description: Publish as a prerelease
        required: true
        default: false
        type: boolean
      draft:
        description: Create the release as a draft
        required: true
        default: true
        type: boolean
permissions:
  contents: write

jobs:
  release:
    name: Build DMG and create GitHub release
    runs-on: macos-26
    env:
      MURMURE_VERSION: ${{ inputs.version }}
      MURMURE_BUILD_NUMBER: ${{ github.run_number }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build and test
        run: |
          swift build -Xswiftc -warnings-as-errors
          swift test -Xswiftc -warnings-as-errors

      - name: Audit repository contents
        run: |
          ! git ls-files | grep -E '\.(wav|aiff|aif|caf|m4a|mp3|p12|mobileprovision)$'
          ! git grep -nE 'sk-[A-Za-z0-9]{20,}'

      - name: Sign, notarize, and build DMG
        env:
          DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          BUILD_KEYCHAIN_PASSWORD: ${{ secrets.BUILD_KEYCHAIN_PASSWORD }}
          APP_STORE_CONNECT_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: ./Scripts/release.sh

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Murmure-${{ inputs.version }}-macos
          path: |
            .build/release-artifacts/*.dmg
            .build/release-artifacts/*.sha256
          if-no-files-found: error

      - name: Create GitHub release
        run: |
          tag="v$MURMURE_VERSION"
          release_args=("$tag" ".build/release-artifacts/Murmure-$MURMURE_VERSION-macos.dmg" ".build/release-artifacts/Murmure-$MURMURE_VERSION-macos.dmg.sha256" "--title" "Murmure $MURMURE_VERSION" "--generate-notes")
          [[ "${{ inputs.draft }}" == "true" ]] && release_args+=("--draft")
          [[ "${{ inputs.prerelease }}" == "true" ]] && release_args+=("--prerelease")
          gh release create "${release_args[@]}"
