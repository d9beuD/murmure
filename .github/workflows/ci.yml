name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun --find xcstringstool

      - name: Build
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        run: ./Scripts/check-coverage.sh

      - name: Audit repository contents
        run: |
          ! git ls-files | grep -E '\.(wav|aiff|aif|caf|m4a|mp3|p12|mobileprovision)$'
          ! git grep -nE 'sk-[A-Za-z0-9]{20,}'
